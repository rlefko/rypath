minimum_pre_commit_version: '4.5.1'
default_install_hook_types: [pre-commit, commit-msg, pre-push]
default_stages: [pre-commit]
fail_fast: true

repos:
  - repo: local
    hooks:
      - id: local-handoff
        name: Check staged paths for local handoff material
        entry: python3 scripts/check_handoff.py --staged
        language: system
        pass_filenames: false
        always_run: true
      - id: commit-subject
        name: Check commit subject
        entry: python scripts/check_commit_subject.py
        language: python
        additional_dependencies: [emoji==2.15.0]
        stages: [commit-msg]
      - id: debug-tests
        name: Build and test the debug preset
        entry: bash scripts/check_debug.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-yaml
      - id: end-of-file-fixer
        exclude: ^(LICENSE|third_party/cie/(CIE_xyz_1931_2deg\.csv(_metadata\.json)?|LICENSE\.txt)|tests/fixtures/pbrt/(cornell-box\.pbrt|LICENSE\.txt))$
      - id: trailing-whitespace
        exclude: ^(LICENSE|third_party/cie/(CIE_xyz_1931_2deg\.csv(_metadata\.json)?|LICENSE\.txt)|tests/fixtures/pbrt/cornell-box\.pbrt)$

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: 7d85583be209cb547946c82fbe51f4bc5dd1d017  # v18.1.8
    hooks:
      - id: clang-format
        types_or: [file]
        files: '\.(c|cc|cpp|cxx|h|hh|hpp|hxx|m|mm|metal)$'
